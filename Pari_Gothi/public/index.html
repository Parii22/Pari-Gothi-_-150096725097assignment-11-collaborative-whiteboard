<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Real-Time Collaborative Multi-User Whiteboard Application built with Node.js, Express, Socket.io and HTML5 Canvas API">
  <title>CollabCanvas — Real-Time Collaborative Whiteboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <!-- App Container -->
  <div id="app" class="app-container">
    
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 5-3-3L6 11l3 3L18 5Z"></path>
            <path d="m14 2 3 3"></path>
            <path d="M2 22h20"></path>
          </svg>
        </div>
        <div class="brand-title">
          <h1>CollabCanvas</h1>
          <span class="badge live-badge"><span class="pulse-dot"></span> LIVE</span>
        </div>
      </div>

      <!-- Room & Status Info -->
      <div class="room-info-pill">
        <div class="room-tag">
          <span class="label">ROOM:</span>
          <span id="currentRoomDisplay" class="room-name">demo</span>
        </div>
        <button id="copyRoomBtn" class="btn-icon" title="Copy Invite Link" aria-label="Copy Room Link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
          </svg>
        </button>
        <button id="switchRoomBtn" class="btn-text" title="Switch Room">Change Room</button>
      </div>

      <!-- Active Users & Profile Header -->
      <div class="header-actions">
        <!-- Active collaborator avatars -->
        <div class="collaborators-container" id="collaboratorsContainer" title="Active Collaborators">
          <div class="collaborators-list" id="collaboratorsList">
            <!-- Rendered dynamically -->
          </div>
          <span id="userCountBadge" class="user-count-badge">1 online</span>
        </div>

        <!-- User Profile Pill -->
        <div class="user-profile-pill" id="userProfilePill">
          <span id="userColorIndicator" class="user-color-dot"></span>
          <span id="usernameDisplay" class="user-name-text">You</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="canvas-workspace" id="canvasWorkspace">
      <!-- Background Grid Overlay -->
      <div class="canvas-grid-bg grid-dots" id="canvasGridBg"></div>

      <!-- Canvas Layers -->
      <canvas id="whiteboardCanvas"></canvas>
      <div id="cursorsLayer" class="cursors-layer"></div>

      <!-- Floating Canvas Toolbar -->
      <aside class="floating-toolbar" id="floatingToolbar">
        <!-- Drawing Tools Group -->
        <div class="toolbar-group">
          <button id="brushToolBtn" class="tool-btn active" title="Brush / Pen (B)" data-tool="brush">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 5-3-3L6 11l3 3L18 5Z"></path>
              <path d="m14 2 3 3"></path>
              <path d="M4 22l4-1-3-3-1 4Z"></path>
            </svg>
            <span class="tool-tooltip">Brush</span>
          </button>
          
          <button id="eraserToolBtn" class="tool-btn" title="Eraser (E)" data-tool="eraser">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
              <path d="M22 21H7"></path>
              <path d="m5 11 9 9"></path>
            </svg>
            <span class="tool-tooltip">Eraser</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Color Palette -->
        <div class="toolbar-group color-palette-group" id="colorPaletteGroup">
          <button class="color-swatch active" data-color="#3b82f6" style="--swatch-color: #3b82f6;" title="Blue"></button>
          <button class="color-swatch" data-color="#10b981" style="--swatch-color: #10b981;" title="Emerald"></button>
          <button class="color-swatch" data-color="#f59e0b" style="--swatch-color: #f59e0b;" title="Amber"></button>
          <button class="color-swatch" data-color="#ef4444" style="--swatch-color: #ef4444;" title="Red"></button>
          <button class="color-swatch" data-color="#8b5cf6" style="--swatch-color: #8b5cf6;" title="Purple"></button>
          <button class="color-swatch" data-color="#ec4899" style="--swatch-color: #ec4899;" title="Pink"></button>
          <button class="color-swatch" data-color="#ffffff" style="--swatch-color: #ffffff;" title="White"></button>
          <button class="color-swatch" data-color="#0f172a" style="--swatch-color: #0f172a;" title="Dark"></button>

          <!-- Custom Color Picker -->
          <label class="custom-color-picker" title="Custom Color">
            <input type="color" id="customColorInput" value="#3b82f6">
            <span class="color-picker-icon" id="customColorIcon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m4.93 4.93 4.24 4.24"></path>
                <path d="m14.83 9.17 4.24-4.24"></path>
                <path d="m14.83 14.83 4.24 4.24"></path>
                <path d="m9.17 14.83-4.24 4.24"></path>
              </svg>
            </span>
          </label>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Brush Size Control -->
        <div class="toolbar-group size-control-group">
          <div class="size-preview-wrapper" title="Current Size">
            <div id="sizePreviewDot" class="size-preview-dot"></div>
          </div>
          <input type="range" id="brushSizeSlider" min="1" max="40" value="4" class="size-slider" title="Brush Size">
          <span id="brushSizeValue" class="size-label">4px</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Canvas Action Buttons (Undo, Clear, Export) -->
        <div class="toolbar-group actions-group">
          <button id="undoBtn" class="action-btn" title="Undo Last Stroke (Ctrl+Z)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
            <span class="btn-label">Undo</span>
          </button>

          <button id="clearBtn" class="action-btn danger-btn" title="Clear Canvas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              <line x1="10" x2="10" y1="11" y2="17"></line>
              <line x1="14" x2="14" y1="11" y2="17"></line>
            </svg>
            <span class="btn-label">Clear</span>
          </button>

          <button id="exportBtn" class="action-btn" title="Export as PNG">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" x2="12" y1="15" y2="3"></line>
            </svg>
            <span class="btn-label">Export</span>
          </button>
        </div>
      </aside>

      <!-- Toast Notification Container -->
      <div id="toastContainer" class="toast-container"></div>
    </main>

    <!-- Join Room Modal -->
    <div id="joinModal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 5-3-3L6 11l3 3L18 5Z"></path>
              <path d="m14 2 3 3"></path>
              <path d="M2 22h20"></path>
            </svg>
          </div>
          <h2>Join Collaborative Whiteboard</h2>
          <p>Create or enter a room to sketch and brainstorm in real-time.</p>
        </div>

        <form id="joinForm" class="join-form">
          <div class="form-group">
            <label for="roomInput">Room ID / Board Name</label>
            <div class="input-wrapper">
              <input type="text" id="roomInput" placeholder="e.g. demo, sprint-review, design-101" required autocomplete="off">
            </div>
            <span class="form-hint">Tip: Share the same room name or URL with your teammates to draw together.</span>
          </div>

          <div class="form-group">
            <label for="usernameInput">Your Name</label>
            <div class="input-wrapper">
              <input type="text" id="usernameInput" placeholder="Enter your display name" required autocomplete="name">
            </div>
          </div>

          <div class="form-group">
            <label>Select Your Cursor Color</label>
            <div class="color-selection-grid" id="modalColorGrid">
              <button type="button" class="user-color-choice active" data-color="#3b82f6" style="--choice-color: #3b82f6;"></button>
              <button type="button" class="user-color-choice" data-color="#10b981" style="--choice-color: #10b981;"></button>
              <button type="button" class="user-color-choice" data-color="#f59e0b" style="--choice-color: #f59e0b;"></button>
              <button type="button" class="user-color-choice" data-color="#ef4444" style="--choice-color: #ef4444;"></button>
              <button type="button" class="user-color-choice" data-color="#8b5cf6" style="--choice-color: #8b5cf6;"></button>
              <button type="button" class="user-color-choice" data-color="#ec4899" style="--choice-color: #ec4899;"></button>
              <button type="button" class="user-color-choice" data-color="#06b6d4" style="--choice-color: #06b6d4;"></button>
              <button type="button" class="user-color-choice" data-color="#f97316" style="--choice-color: #f97316;"></button>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <span>Enter Board</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Socket.io client script -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Client whiteboard logic -->
  <script src="canvas.js"></script>
</body>
</html>
